name: Perbarui data repository
on:
  schedule:
    # setiap ~10 menit (dipertahankan sesuai keputusan main), tiap run loop 120s
    - cron: '2-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repo-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Perbarui data otomatis (loop ±2 menit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-loop.sh

      - name: Selesai
        if: always()
        run: echo "Selesai — data repository diperbarui berulang setiap ±2 menit dalam tiap run."
