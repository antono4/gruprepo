(() => {

  const chipsBox = document.getElementById('chips');
  const empty = document.getElementById('empty');
  const fetchDate = document.getElementById('fetchDate');
  fetchDate.textContent = 'update ' + new Date(DATA[0].updated_at).toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric' });

  const CATEGORIES_MAP = {
    'Web & Frontend': ['HTML','CSS','SCSS','Astro','Nunjucks','EJS','Vue','Svelte'],
    'JavaScript & TypeScript': ['JavaScript','TypeScript','Node.js','Deno'],
    'Python & AI': ['Python','Jupyter Notebook'],

    'Lainnya': []
  };

  const CATEGORY_ORDER = ['Web & Frontend', 'JavaScript & TypeScript', 'Python & AI', 'PHP', 'Lainnya', 'Backend & Databases', 'Mobile & Desktop', 'Fork & Kontribusi'];

  const LANG_COLORS = {
    'HTML': '#e34c26', 'CSS': '#563d7c', 'SCSS': '#c6538c', 'JavaScript': '#f1e05a',
    'TypeScript': '#3178c6', 'Python': '#3572A5', 'Jupyter Notebook': '#DA5B0B',
    'PHP': '#4F5D95', 'Pascal': '#E3F171', 'Delphi': '#B1CEFF', 'Java': '#b07219',
    'C#': '#178600', 'C++': '#f34b7d', 'C': '#555555', 'Go': '#00ADD8', 'Rust': '#dea584',
    'Shell': '#89e051', 'Batchfile': '#C1F12E', 'PowerShell': '#012456', 'Kotlin': '#A97BFF',
    'Dart': '#00B4AB', 'Vue': '#41b883', 'Astro': '#ff5a03', 'Nunjucks': '#3d8137',
    'EJS': '#a91e50', 'Svelte': '#ff3e00', 'Swift': '#F05138', 'Perl': '#0298c3',
    'Ruby': '#701516', 'Markdown': '#083fa1', 'Haskell': '#5e5086', 'Elixir': '#6e4a7e',
    'Scala': '#c22d40', 'Lua': '#000080', 'Julia': '#a270ba', 'R': '#198ce7', 'Kotlin': '#A97BFF'
  };

  const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
  const langColor = l => LANG_COLORS[l] || '#8b949e';
  const shortName = n => String(n).replace(/^-+/, '');
  function cleanDesc(d) {
    if (!d) return '';
    return String(d)
      .replace(/^\\s*[^\\w\\s]{1,3}\\s*/, '')
      .replace(/^(Web project|AI project)\\s*-\\s*/i, '')
      .replace(/^\\S+\\s*-\\s*(Source code.*)?$/, '')
      .replace(/^\\S+\\s*-\\s*/i, '')
      .trim().replace(/^[-–—\\s]+/, '').trim();
  }
  function timeAgo(s) {
    const dt = new Date(s);
    const diff = (Date.now() - dt.getTime()) / 86400000;
    if (diff < 1) return 'hari ini';
    if (diff < 30) return Math.max(1, Math.round(diff)) + 'h';
    if (diff < 365) return Math.round(diff / 30) + 'bln';
    return Math.round(diff / 365) + 'thn';
  }
  function categoryOf(r) {
    if (r.fork) return 'Fork & Kontribusi';
    const l = r.language;
    if (!l) return 'Lainnya';
    for (const [cat, langs] of Object.entries(CATEGORIES_MAP)) {
      if (!langs.length) continue;
      if (langs.includes(l)) return cat;
    }
    return 'Lainnya';
  }

  const countBy = cat => DATA.filter(r => categoryOf(r) === cat).length;

  // chips
  let chipsHtml = '<button class="chip active" data-chip="all">Semua <span>' + DATA.filter(r => !r.fork).length + '</span></button>';
  const counts = {};
  for (const c of CATEGORY_ORDER) counts[c] = countBy(c);
  const ordered = CATEGORY_ORDER.filter(c => counts[c] > 0).sort((a, b) => counts[b] - counts[a]);
  for (const c of ordered) {
    chipsHtml += `<button class="chip" data-chip="${esc(c)}">${esc(c)} <span>${counts[c]}</span></button>`;
  }
  chipsBox.innerHTML = chipsHtml;

  // language options
  const langCounts = {};
  for (const r of DATA) { if (r.language) langCounts[r.language] = (langCounts[r.language] || 0) + 1; }
  const langSel = document.getElementById('langFilter');
  for (const [l, c] of Object.entries(langCounts).sort((a, b) => b[1] - a[1])) {
    langSel.insertAdjacentHTML('beforeend', `<option value="${esc(l.toLowerCase())}">${esc(l)} (${c})</option>`);
  }

  function card(r) {
    const name = shortName(r.name);

    if (r.fork) badges += `<span class="badge badge-fork" title="Fork">⑂ Fork</span>`;

      <article class="card">
        <div class="card-top">
          <svg class="repo-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 0 1-.517 1.249A2.5 2.5 0 0 1 2 13.5v-11zm10.5 5h-8v2.5a1 1 0 0 1 .69.95H12.5V5zm-8-3.5A1 1 0 0 0 3.5 2.5v11.5a1 1 0 0 0 .69.95h8.31v-13.5h-8.5z"/></svg>
          <a class="repo-link" href="${esc(r.html_url)}" target="_blank" rel="noopener">${esc(name)}</a>
          ${badges}
        </div>
        ${desc ? `<p class="desc">${esc(desc)}</p>` : '<p class="desc muted">Tidak ada deskripsi</p>'}
        <div class="card-meta">
          ${lang ? `<span class="lang"><span class="lang-dot" style="background:${langColor(lang)}"></span>${esc(lang)}</span>` : ''}
          <span class="spacer"></span>
          ${stars ? `<span class="stat" title="${stars} stars"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 13.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/></svg>${stars}</span>` : ''}
          ${forks ? `<span class="stat" title="${forks} forks"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a.25.25 0 0 1 .41-.192l2.36 2.11a.25.25 0 0 1 0 .384l-2.36 2.11a.25.25 0 0 1-.41-.192v-.878a.75.75 0 0 0-.75-.75h-4.5a.75.75 0 0 0-.75.75z" transform="translate(0 1)"/><path d="M1 5v2c0 .55.45 1 1 1h8c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1H2c-.55 0-1 .45-1 1zm1 0h8v2H2V5z"/></svg>${forks}</span>` : ''}
          ${updated ? `<span class="updated">◷ ${esc(updated)}</span>` : ''}
        </div>
      </article>`;
  }

  let showForks = false;
  let activeChip = 'all';

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const lang = document.getElementById('langFilter').value;
    const sortVal = document.getElementById('sort').value;

    let items = DATA.filter(r => {
      if (!showForks && r.fork) return false;
      if (activeChip !== 'all' && categoryOf(r) !== activeChip) return false;
      if (lang && (r.language || '').toLowerCase() !== lang) return false;
      if (q) {
        const haystack = (shortName(r.name) + ' ' + r.name + ' ' + (r.description || '')).toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    if (sortVal === 'stars') items.sort((a, b) => (b.stargazers_count || 0) - (a.stargazers_count || 0));
    else if (sortVal === 'name') items.sort((a, b) => shortName(a.name).localeCompare(shortName(b.name), 'id'));
    else items.sort((a, b) => String(b.pushed_at || '').localeCompare(String(a.pushed_at || '')));

    const groups = {};
    for (const r of items) {
      const c = categoryOf(r);
      (groups[c] ||= []).push(r);
    }

    let htmlStr = '';
    let totalShown = 0;
    const orderedCats = Object.keys(groups).sort((a, b) => {
      if (b === a) return 0;
      if (a === 'Fork & Kontribusi') return 1;
      if (b === 'Fork & Kontribusi') return -1;
      return groups[b].length - groups[a].length;
    });
    for (const c of orderedCats) {
      const list = groups[c];
      if (!list || !list.length) continue;
      totalShown += list.length;
      htmlStr += `
        <section class="section">
          <header class="section-head">
            <h2>${esc(c)} <span class="count">${list.length}</span></h2>
            <svg class="section-icon" viewBox="0 0 16 16" fill="currentColor" width="18" height="18"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 0 1-.517 1.249A2.5 2.5 0 0 1 2 13.5v-11zm10.5 5h-8v2.5a1 1 0 0 1 .69.95H12.5V5zm-8-3.5A1 1 0 0 0 3.5 2.5v11.5a1 1 0 0 0 .69.95h8.31v-13.5h-8.5z"/></svg>
          </header>
          <div class="grid">${list.map(card).join('')}</div>
        </section>`;
    }

    if (!totalShown) {
      empty.classList.add('show');
      main.innerHTML = '';
    } else {
      empty.classList.remove('show');
      main.innerHTML = htmlStr;
    }
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('langFilter').addEventListener('change', render);
  document.getElementById('sort').addEventListener('change', render);
  document.getElementById('forkBtn').addEventListener('click', e => {
    showForks = !showForks;
    e.currentTarget.classList.toggle('active', showForks);
    render();
  });
  chipsBox.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    chipsBox.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    b.classList.add('active');
    activeChip = b.dataset.chip;
    render();
  });

  render();
})();
</script>
</body>
</html>
